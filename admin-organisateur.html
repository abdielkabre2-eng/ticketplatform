<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Espace Organisateur / Bénéficiaire</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body { font-family: Arial, sans-serif; background: #f4f7f6; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 25px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .tabs { display: flex; justify-content: space-around; margin-bottom: 20px; border-bottom: 2px solid #ddd; padding-bottom: 10px; }
        .tab-btn { background: none; border: none; font-size: 18px; font-weight: bold; cursor: pointer; padding: 10px 20px; color: #666; }
        .tab-btn.active { color: #007bff; border-bottom: 3px solid #007bff; }
        .section-content { display: none; }
        .section-content.active { display: block; }
        .billet-card { background: #fff; border: 1px solid #ddd; padding: 15px; border-radius: 8px; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .billet-card img { max-width: 200px; display: block; margin: 10px 0; border-radius: 5px; }
        
        /* Styles des boutons d'action */
        .btn-confirmer { background: #28a745; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .btn-refuser { background: #dc3545; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; margin-left: 5px; }
        .btn-attente { background: #ffc107; color: #333; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; margin-left: 5px; }
        
        .badge-statut { display: inline-block; padding: 5px 10px; border-radius: 4px; font-weight: bold; font-size: 14px; margin-bottom: 10px; }
        .badge-attente { background: #fff3cd; color: #856404; border: 1px solid #ffeeba; }
        .badge-confirme { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .badge-refuse { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }

        /* Style de la boîte de résultat du scan */
        #resultatScan {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            text-align: center;
        }
        #reader { width: 100%; max-width: 400px; margin: 0 auto; }
    </style>
</head>
<body>

    <div class="container">
        <h1 id="titreEvenementOrg">Espace Organisateur</h1>
        <p id="infosEvenementOrg">Chargement des informations...</p>

        <!-- Les deux onglets -->
        <div class="tabs">
            <button class="tab-btn active" onclick="changerOnglet('paiements', event)">1. Demandes de Paiement</button>
            <button class="tab-btn" onclick="changerOnglet('scanner', event)">2. Scanner les Billets</button>
        </div>

        <!-- SECTION 1 : TOUTES LES DEMANDES DE PAIEMENT -->
        <div id="section-paiements" class="section-content active">
            <h2>Gestion des paiements</h2>
            <div id="listePaiements">
                <p>Chargement des demandes...</p>
            </div>
        </div>

        <!-- SECTION 2 : SCANNER -->
        <div id="section-scanner" class="section-content">
            <h2>Contrôle des Billets (Jour J)</h2>
            <p>Scannez le QR Code avec la caméra du téléphone ou entrez le code manuellement :</p>
            
            <!-- Caméra pour les téléphones -->
            <div id="reader"></div>

            <div style="margin-top: 20px; text-align: center;">
                <input type="text" id="codeBilletInput" placeholder="ID ou Code du billet..." style="padding: 10px; width: 60%; border: 1px solid #ccc; border-radius: 5px;">
                <button onclick="verifierBilletManuel()" style="padding: 10px 20px; background: #007bff; color: white; border: none; border-radius: 5px; font-weight: bold; cursor: pointer;">Vérifier</button>
            </div>

            <div id="resultatScan"></div>
        </div>
    </div>

    <!-- Scripts Supabase et Scanner QR -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        let eventId = urlParams.get("event");
        let html5QrCode = null;

        async function chargerEspaceOrganisateur() {
            if (!eventId) {
                document.getElementById("titreEvenementOrg").textContent = "Erreur";
                document.getElementById("infosEvenementOrg").textContent = "Aucun événement spécifié.";
                return;
            }

            const { data: ev, error } = await window.supabaseClient
                .from("evenements")
                .select("*")
                .eq("id", eventId)
                .single();

            if (error || !ev) {
                document.getElementById("infosEvenementOrg").textContent = "Événement introuvable.";
                return;
            }

            document.getElementById("titreEvenementOrg").textContent = `Organisateur : ${ev.titre}`;
            document.getElementById("infosEvenementOrg").innerHTML = `📅 Date : ${ev.date} à ${ev.heure} | 📍 Lieu : ${ev.lieu}`;

            chargerToutesLesDemandes();
        }

        // Charger TOUTES les demandes de l'événement
        async function chargerToutesLesDemandes() {
            let container = document.getElementById("listePaiements");

            const { data: billets, error } = await window.supabaseClient
                .from("billets")
                .select("*")
                .eq("evenement_id", eventId)
                .order("id", { ascending: false });

            if (error) {
                container.innerHTML = "<p>Erreur lors du chargement des paiements.</p>";
                return;
            }

            if (!billets || billets.length === 0) {
                container.innerHTML = "<p>Aucune demande de paiement pour le moment.</p>";
                return;
            }

            container.innerHTML = "";
            billets.forEach(function(b) {
                let statutHtml = "";
                if (b.statut === "confirme") {
                    statutHtml = `<span class="badge-statut badge-confirme">✅ Confirmé / Payé</span>`;
                } else if (b.statut === "refuse") {
                    statutHtml = `<span class="badge-statut badge-refuse">❌ Refusé / Non reçu</span>`;
                } else {
                    statutHtml = `<span class="badge-statut badge-attente">⏳ En attente</span>`;
                }

                container.innerHTML += `
                    <div class="billet-card">
                        ${statutHtml}
                        <p><strong>Nom du participant :</strong> ${b.nom_participant}</p>
                        <p><strong>Téléphone WhatsApp :</strong> ${b.telephone}</p>
                        <p><strong>Capture du paiement :</strong></p>
                        <a href="${b.preuve_url}" target="_blank"><img src="${b.preuve_url}" alt="Preuve de paiement"></a>
                        <br>
                        <div style="margin-top: 10px;">
                            <button class="btn-confirmer" onclick="changerStatut(${b.id}, 'confirme')">✅ J'ai reçu</button>
                            <button class="btn-refuser" onclick="changerStatut(${b.id}, 'refuse')">❌ Non reçu</button>
                            <button class="btn-attente" onclick="changerStatut(${b.id}, 'attente')">⏳ Mettre en attente</button>
                        </div>
                    </div>
                `;
            });
        }

   // Mettre à jour le statut du billet
        async function changerStatut(billetId, nouveauStatut) {
            let updateData = { statut: nouveauStatut };

            if (nouveauStatut === 'confirme') {
                // On s'assure que le QR code contient l'ID direct ou le numéro exact
                let codeUnique = `${billetId}`; // ou un format court simple
                updateData.qr_code = codeUnique;
                updateData.numero_billet = codeUnique;
            }

            const { error } = await window.supabaseClient
                .from("billets")
                .update(updateData)
                .eq("id", billetId);

            if (error) {
                alert("Erreur lors de la mise à jour : " + error.message);
                return;
            }

            chargerToutesLesDemandes();
        }   

      // Gestion centrale de la vérification et de l'anti-fraude (extraction intelligente du numéro)
        async function traiterVerificationBillet(codeScanne) {
            let resultatDiv = document.getElementById("resultatScan");
            let code = codeScanne ? codeScanne.trim() : "";

            if (!code) {
                resultatDiv.style.background = "#fff3cd";
                resultatDiv.style.color = "#856404";
                resultatDiv.textContent = "⚠️ Veuillez entrer ou scanner un code de billet.";
                return;
            }

            // On extrait tous les chiffres présents dans le texte scanné (ex: "BILLET-EVENT-14-ID-64" -> extrait "64" ou l'ID de l'événement)
            let chiffresTrouves = code.match(/\d+/g);
            let idBilletExtrait = chiffresTrouves ? chiffresTrouves[chiffresTrouves.length - 1] : code;

            // On récupère tous les billets de cet événement
            const { data: billets, error } = await window.supabaseClient
                .from("billets")
                .select("*")
                .eq("evenement_id", eventId);

            if (error || !billets) {
                resultatDiv.style.background = "#f8d7da";
                resultatDiv.style.color = "#721c24";
                resultatDiv.textContent = "❌ Erreur de connexion avec la base de données.";
                return;
            }

            // On cherche le billet dont l'ID correspond au numéro extrait du QR code
            let b = billets.find(item => 
                item.id.toString() === idBilletExtrait || 
                item.id.toString() === code ||
                (item.numero_billet && code.includes(item.numero_billet)) || 
                (item.qr_code && code.includes(item.qr_code))
            );

            if (!b) {
                resultatDiv.style.background = "#f8d7da";
                resultatDiv.style.color = "#721c24";
                resultatDiv.textContent = `❌ Billet introuvable pour ce code (${code}).`;
                return;
            }

            // Vérification si le paiement est confirmé
            if (b.statut !== "confirme") {
                resultatDiv.style.background = "#fff3cd";
                resultatDiv.style.color = "#856404";
                resultatDiv.textContent = `⚠️ Entrée refusée : Ce billet n'est pas confirmé (Statut : ${b.statut}).`;
                return;
            }

            // 🚨 CONTRÔLE ANTI-FRAUDE : Billet déjà utilisé ?
            if (b.utilise === true || b.utilise === "true") {
                resultatDiv.style.background = "#f8d7da";
                resultatDiv.style.color = "#721c24";
                resultatDiv.innerHTML = `
                    🚨 <strong>ENTRÉE NON VALIDE - BILLET DÉJÀ UTILISÉ !</strong><br>
                    <span style="font-size: 14px; font-weight: normal; color: #333;">
                        Propriétaire : <strong>${b.nom_participant || 'N/A'}</strong> | Tél : ${b.telephone}
                    </span>
                `;
                return;
            }

            // PREMIÈRE VALIDATION : On verrouille le billet en passant `utilise` à true
            const { error: updateError } = await window.supabaseClient
                .from("billets")
                .update({ utilise: true })
                .eq("id", b.id);

            if (updateError) {
                resultatDiv.style.background = "#f8d7da";
                resultatDiv.style.color = "#721c24";
                resultatDiv.textContent = "❌ Erreur lors de la validation de l'entrée.";
                return;
            }

            // SUCCÈS : Entrée autorisée
            resultatDiv.style.background = "#d4edda";
            resultatDiv.style.color = "#155724";
            resultatDiv.innerHTML = `
                ✅ <strong>ENTRÉE VALIDE</strong><br>
                <span style="font-size: 14px; font-weight: normal; color: #333;">
                    Bienvenue à <strong>${b.nom_participant || 'N/A'}</strong><br>
                    Téléphone : ${b.telephone} | Billet N° : ${b.id}
                </span>
            `;
        } 
        function verifierBilletManuel() {
            let code = document.getElementById("codeBilletInput").value;
            traiterVerificationBillet(code);
            document.getElementById("codeBilletInput").value = "";
        }

        // Gestion des onglets et activation de la caméra du téléphone
        function changerOnglet(nomOnglet, eventElement) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.section-content').forEach(sec => sec.classList.remove('active'));

            if (nomOnglet === 'paiements') {
                eventElement.currentTarget.classList.add('active');
                document.getElementById('section-paiements').classList.add('active');
                if (html5QrCode && html5QrCode.isScanning) {
                    html5QrCode.stop();
                }
            } else {
                eventElement.currentTarget.classList.add('active');
                document.getElementById('section-scanner').classList.add('active');

                if (!html5QrCode) {
                    html5QrCode = new Html5Qrcode("reader");
                }
                html5QrCode.start(
                    { facingMode: "environment" },
                    { fps: 10, qrbox: 250 },
                    (decodedText) => {
                        traiterVerificationBillet(decodedText);
                    },
                    (errorMessage) => {
                        // Ignore les erreurs de flash en direct
                    }
                ).catch(err => {
                    console.log("Caméra non disponible :", err);
                });
            }
        }

        chargerEspaceOrganisateur();
    </script>
</body>
</html>
