<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scanner Organisateur</title>
    <!-- SDK Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Librairie QR Code Scanner (html5-qrcode) -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background: #f4f7f6; color: #333; }
        .container { max-width: 600px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #2c3e50; font-size: 22px; }
        #reader { width: 100%; border-radius: 8px; overflow: hidden; margin-bottom: 20px; }
        .manual-section { margin-top: 20px; display: flex; gap: 10px; }
        input[type="text"] { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 16px; }
        button { padding: 10px 20px; background: #3498db; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
        button:hover { background: #2980b9; }
        #resultatScan { margin-top: 20px; padding: 15px; border-radius: 4px; font-weight: bold; text-align: center; font-size: 18px; }
    </style>
</head>
<body>

<div class="container">
    <h1>Contrôle des Billets - Organisateur</h1>
    
    <!-- Zone de la caméra pour le scan -->
    <div id="reader"></div>

    <!-- Saisie manuelle de secours -->
    <div class="manual-section">
        <input type="text" id="codeManuel" placeholder="Entrer le code ou ID du billet...">
        <button onclick="verifierCodeManuel()">Vérifier</button>
    </div>

    <!-- Affichage du résultat du scan -->
    <div id="resultatScan">En attente de scan...</div>
</div>

<script>
    // Configuration Supabase
    const SUPABASE_URL = "https://didtpgzelaqlwbrujqdv.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRpZHRwZ3plbGFxbHdicnVqcWR2Iiwicm9sZSI6ImFub24iLCJpYXQiOjM0ODQ0MjY4MzYsImV4cCI6Mzg0MDAwMDAwMn0.FAKE_KEY_OR_YOUR_REAL_KEY"; // Remplace par ta clé si besoin, ou garde ton initialisation habituelle
    
    // Initialisation du client Supabase global
    window.supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Récupérer l'ID de l'événement depuis l'URL (ex: ?event=14)
    const urlParams = new URLSearchParams(window.location.search);
    const eventId = urlParams.get('event');

    async function traiterVerificationBillet(code) {
        let resultatDiv = document.getElementById("resultatScan");
        code = code ? code.trim() : "";

        if (!code) {
            resultatDiv.style.background = "#fff3cd";
            resultatDiv.style.color = "#856404";
            resultatDiv.textContent = "⚠️ Veuillez entrer ou scanner un code de billet.";
            return;
        }

        // Recherche du billet dans Supabase
        const { data: b, error } = await window.supabaseClient
            .from("billets")
            .select("*")
            .or(`id.eq.${code},numero_billet.eq.${code},qr_code.eq.${code}`)
            .single();

        if (error || !b) {
            resultatDiv.style.background = "#f8d7da";
            resultatDiv.style.color = "#721c24";
            resultatDiv.textContent = "❌ Billet introuvable dans la base de données.";
            return;
        }

        // Vérification si le paiement est confirmé
        if (b.statut !== "confirme") {
            resultatDiv.style.background = "#fff3cd";
            resultatDiv.style.color = "#856404";
            resultatDiv.textContent = `⚠️ Entrée refusée : Ce billet n'est pas confirmé (Statut : ${b.statut}).`;
            return;
        }

        // 🚨 CONTRÔLE ANTI-FRAUDE : Billet déjà utilisé ?
        if (b.utilise === true || b.utilise === "true") {
            resultatDiv.style.background = "#f8d7da";
            resultatDiv.style.color = "#721c24";
            resultatDiv.innerHTML = `
                🚨 <strong>ENTRÉE NON VALIDE - BILLET DÉJÀ UTILISÉ !</strong><br>
                <span style="font-size: 14px; font-weight: normal; color: #333;">
                    Participant : ${b.nom_participant || 'N/A'} | Tél : ${b.telephone}
                </span>
            `;
            return;
        }

        // PREMIÈRE VALIDATION : On marque le billet comme utilisé (true)
        const { error: updateError } = await window.supabaseClient
            .from("billets")
            .update({ utilise: true })
            .eq("id", b.id);

        if (updateError) {
            resultatDiv.style.background = "#f8d7da";
            resultatDiv.style.color = "#721c24";
            resultatDiv.textContent = "❌ Erreur lors de la validation de l'entrée.";
            return;
        }

        // SUCCÈS : Entrée autorisée
        resultatDiv.style.background = "#d4edda";
        resultatDiv.style.color = "#155724";
        resultatDiv.innerHTML = `
            ✅ <strong>ENTRÉE VALIDE</strong><br>
            <span style="font-size: 14px; font-weight: normal; color: #333;">
                Bienvenue !<br>
                Participant : ${b.nom_participant || 'N/A'} | Tél : ${b.telephone}
            </span>
        `;
    }

    function verifierCodeManuel() {
        let code = document.getElementById("codeManuel").value;
        traiterVerificationBillet(code);
    }

    // Démarrage de la caméra avec html5-qrcode
    function onScanSuccess(decodedText, decodedResult) {
        console.log(`Code scanned = ${decodedText}`, decodedResult);
        traiterVerificationBillet(decodedText);
    }

    let html5QrCode = new Html5Qrcode("reader");
    html5QrCode.start(
        { facingMode: "environment" }, 
        { fps: 10, qrbox: { width: 250, height: 250 } },
        onScanSuccess
    ).catch(err => {
        console.error("Erreur d'accès à la caméra : ", err);
    });
</script>

</body>
</html>
