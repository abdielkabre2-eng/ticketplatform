<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Achat de Billet | GoldTix</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #d97706;
            --primary-gradient: linear-gradient(135deg, #f59e0b 0%, #b45309 100%);
            --primary-glow: rgba(217, 119, 6, 0.3);
            --bg-main: #f8fafc;
            --card-bg: rgba(255, 255, 255, 0.9);
            --card-border: rgba(217, 119, 6, 0.12);
            --input-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --radius-lg: 28px;
            --radius-md: 16px;
            --transition-smooth: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: var(--bg-main);
            background-image: 
                radial-gradient(circle at 10% 10%, rgba(245, 158, 11, 0.08) 0px, transparent 50%),
                radial-gradient(circle at 90% 90%, rgba(217, 119, 6, 0.06) 0px, transparent 50%),
                radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.8) 0px, transparent 100%);
            background-attachment: fixed;
            color: var(--text-main); 
            padding: 30px 20px 80px 20px; 
            line-height: 1.6;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* --- ANIMATIONS HORS DU COMMUN (CINÉMATIQUE) --- */
        @keyframes heroEntrance {
            0% {
                opacity: 0;
                transform: translateY(40px) scale(0.98);
                filter: blur(10px);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
                filter: blur(0);
            }
        }

        @keyframes pulseGlow {
            0%, 100% { box-shadow: 0 0 20px rgba(217, 119, 6, 0.2); }
            50% { box-shadow: 0 0 35px rgba(217, 119, 6, 0.45); }
        }

        @keyframes floatEffect {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }

        .animate-entrance-1 {
            animation: heroEntrance 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .animate-entrance-2 {
            opacity: 0;
            animation: heroEntrance 1s cubic-bezier(0.16, 1, 0.3, 1) 0.2s forwards;
        }

        .animate-entrance-3 {
            opacity: 0;
            animation: heroEntrance 1s cubic-bezier(0.16, 1, 0.3, 1) 0.4s forwards;
        }

        /* --- NAVBAR --- */
        .top-navbar {
            max-width: 1100px;
            margin: 0 auto 40px auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 16px 28px;
            border-radius: 20px;
            border: 1px solid var(--card-border);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.02);
        }

        .brand-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .site-logo {
            height: 40px;
            width: auto;
            transition: var(--transition-smooth);
        }

        .site-logo:hover {
            transform: scale(1.05) rotate(-3deg);
        }

        .brand-title {
            font-size: 26px;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: #0f172a;
        }

        .brand-title span {
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .secure-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(16, 185, 129, 0.1);
            color: #059669;
            border: 1px solid rgba(16, 185, 129, 0.2);
            padding: 8px 16px;
            border-radius: 30px;
            font-size: 12px;
            font-weight: 700;
            backdrop-filter: blur(10px);
            white-space: nowrap;
        }

        .main-wrapper {
            max-width: 1100px;
            margin: 0 auto;
        }

        .grid-container {
            display: grid;
            grid-template-columns: 1fr 1.15fr;
            gap: 36px;
            align-items: start;
        }

        @media (max-width: 900px) {
            .grid-container {
                grid-template-columns: 1fr;
            }
        }

        .event-card, .form-card {
            background: var(--card-bg);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-radius: var(--radius-lg);
            padding: 36px;
            border: 1px solid var(--card-border);
            box-shadow: 0 20px 40px -15px rgba(217, 119, 6, 0.08), 0 10px 20px -10px rgba(0, 0, 0, 0.03);
            transition: var(--transition-smooth);
        }

        .event-card:hover {
            box-shadow: 0 30px 60px -20px rgba(217, 119, 6, 0.15), 0 15px 30px -15px rgba(0, 0, 0, 0.05);
        }

        .event-poster-wrapper {
            width: 100%;
            border-radius: var(--radius-md);
            overflow: hidden;
            background: #ffffff;
            background-image: radial-gradient(circle at center, rgba(245, 158, 11, 0.05) 0%, #ffffff 80%);
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(217, 119, 6, 0.1);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.04);
            padding: 12px;
            transition: var(--transition-smooth);
        }

        .event-poster-wrapper:hover {
            transform: scale(1.01);
        }

        .event-poster-wrapper img {
            width: 100%;
            height: auto;
            max-height: 500px;
            object-fit: contain;
            border-radius: 10px;
        }

        .event-title {
            font-size: 28px;
            font-weight: 800;
            color: #0f172a;
            margin: 0 0 18px 0;
            letter-spacing: -0.8px;
            line-height: 1.25;
        }

        .event-meta-item {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 15px;
            color: var(--text-muted);
            margin-bottom: 14px;
            font-weight: 500;
        }

        .price-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 20px;
            padding: 14px 24px;
            background: var(--primary-gradient);
            color: #ffffff;
            border-radius: var(--radius-md);
            font-weight: 800;
            font-size: 18px;
            box-shadow: 0 10px 25px var(--primary-glow);
            animation: floatEffect 4s ease-in-out infinite;
        }

        .payment-box {
            background: linear-gradient(135deg, #fefce8 0%, #fef9c3 100%);
            border: 1px solid rgba(245, 158, 11, 0.3);
            border-radius: var(--radius-md);
            padding: 24px;
            margin-bottom: 30px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(245, 158, 11, 0.05);
        }

        .payment-box::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 5px; height: 100%;
            background: var(--primary-gradient);
        }

        .form-section-title {
            font-size: 18px;
            font-weight: 800;
            margin: 0 0 20px 0;
            color: #0f172a;
            letter-spacing: -0.4px;
        }

        .form-group {
            margin-bottom: 22px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 800;
            color: #b45309;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        input[type="text"],
        input[type="email"],
        input[type="tel"],
        input[type="file"],
        select {
            width: 100%;
            padding: 16px 18px;
            font-size: 15px;
            font-family: inherit;
            border: 2px solid #e2e8f0;
            border-radius: var(--radius-md);
            outline: none;
            background: var(--input-bg);
            color: #0f172a;
            transition: var(--transition-smooth);
        }

        input[type="text"]:focus,
        input[type="email"]:focus,
        input[type="tel"]:focus,
        select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 6px var(--primary-glow);
            background: #ffffff;
            transform: translateY(-2px);
        }

        input[type="file"] {
            padding: 12px;
            cursor: pointer;
            color: var(--text-muted);
            background: #f8fafc;
        }

        input[type="file"]::file-selector-button {
            background: #fef3c7;
            border: 1px solid #fde68a;
            color: #b45309;
            padding: 10px 16px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 700;
            margin-right: 14px;
            transition: var(--transition-smooth);
        }

        input[type="file"]::file-selector-button:hover {
            background: #fde68a;
        }

        button#btnValiderAchat { 
            background: var(--primary-gradient); 
            color: white; 
            border: none; 
            padding: 18px 24px; 
            width: 100%; 
            border-radius: var(--radius-md); 
            font-size: 16px;
            font-weight: 800; 
            cursor: pointer; 
            transition: var(--transition-smooth);
            box-shadow: 0 12px 30px var(--primary-glow);
            margin-top: 10px;
            letter-spacing: 0.5px;
            animation: pulseGlow 3s infinite;
        }

        button#btnValiderAchat:hover { 
            transform: translateY(-3px) scale(1.01);
            box-shadow: 0 20px 40px rgba(217, 119, 6, 0.45);
        }

        button#btnValiderAchat:active {
            transform: translateY(1px);
        }

        button#btnValiderAchat:disabled {
            background: #cbd5e1;
            color: #64748b;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
            animation: none;
        }

        .closed-sales-box {
            background: #fef2f2;
            border: 1px solid #fecaca;
            border-radius: var(--radius-md);
            padding: 35px 25px;
            text-align: center;
        }

        .closed-sales-box h3 {
            color: #dc2626;
            font-size: 22px;
            font-weight: 800;
            margin-bottom: 12px;
        }

        .closed-sales-box p {
            color: #991b1b;
            font-size: 15px;
            line-height: 1.6;
        }

        .creator-footer {
            max-width: 1100px;
            margin: 60px auto 0 auto;
            padding-top: 30px;
            border-top: 1px solid #e2e8f0;
            text-align: center;
            font-size: 13px;
            color: var(--text-muted);
        }

        .creator-footer a {
            color: #d97706;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s ease;
        }

        .creator-footer a:hover {
            color: #b45309;
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="top-navbar animate-entrance-1">
        <div class="brand-container">
            <img src="logo.png" alt="GoldTix Logo" class="site-logo">
            <div class="brand-title">Gold<span>Tix</span></div>
        </div>
        <span class="secure-badge">🔒 Billetterie Hautement Sécurisée</span>
    </div>

    <div class="main-wrapper">
        <div id="detailsEvenement" class="animate-entrance-2">
            <div class="event-card" style="text-align: center; padding: 60px 20px;">
                <p style="color: var(--text-muted); font-size: 16px; font-weight: 600;">✨ Chargement de votre expérience...</p>
            </div>
        </div>
    </div>

    <footer class="creator-footer animate-entrance-3">
        <p style="margin-bottom: 6px; font-weight: 700; letter-spacing: 0.5px;">— LA BILLETTERIE EN OR —</p>
        <p style="margin: 0;">
            Plateforme propulsée par <strong>GoldTix</strong> | Développée par <strong>Abdiel KABRE</strong><br>
            📧 <a href="mailto:abdielkabre2@gmail.com">abdielkabre2@gmail.com</a> | 
            📞 <a href="https://wa.me/22653107345" target="_blank">+226 53 10 73 45</a> / <a href="https://wa.me/212770967646" target="_blank">+212 770-967646</a>
        </p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>
    <script>
        async function chargerPageAchatUnique() {
            const urlParams = new URLSearchParams(window.location.search);
            let eventId = urlParams.get("event");
            let container = document.getElementById("detailsEvenement");

            if (!eventId) {
                container.innerHTML = "<div class='event-card' style='text-align:center;'><h2>Erreur</h2><p style='color: var(--text-muted); margin-top: 10px;'>Aucun événement spécifié dans le lien.</p></div>";
                return;
            }

            const { data: ev, error } = await window.supabaseClient
                .from("evenements")
                .select("*")
                .eq("id", eventId)
                .single();

            if (error || !ev) {
                container.innerHTML = "<div class='event-card' style='text-align:center;'><h2>Événement introuvable</h2><p style='color: var(--text-muted); margin-top: 10px;'>Ce lien est expiré ou invalide.</p></div>";
                return;
            }

            let contenuColonneDroite = "";

            if (ev.ventes_fermees) {
                contenuColonneDroite = `
                    <div class="form-card animate-entrance-3">
                        <div class="closed-sales-box">
                            <h3>🔴 Ventes fermées</h3>
                            <p>Les ventes en ligne de billets pour cet événement sont désormais fermées par l'organisateur.</p>
                            <p style="margin-top: 12px; font-size: 13px; color: #64748b; font-weight: 600;">Merci pour votre intérêt !</p>
                        </div>
                    </div>
                `;
            } else {
                let infosCoordonnees = ev.beneficiaire_infos ? ev.beneficiaire_infos : 'Non renseigné';

                let selectionCategorieHTML = "";
                if (ev.categories_data && Array.isArray(ev.categories_data) && ev.categories_data.length > 0) {
                    let optionsHTML = ev.categories_data.map(cat => `<option value="${cat.nom} - ${cat.prix}">${cat.nom} (${cat.prix})</option>`).join("");
                    selectionCategorieHTML = `
                        <div class="form-group">
                            <label for="selectCategorie">Choisissez votre catégorie de billet :</label>
                            <select id="selectCategorie">
                                ${optionsHTML}
                            </select>
                        </div>
                    `;
                }

                contenuColonneDroite = `
                    <div class="form-card animate-entrance-3">
                        <div class="payment-box">
                            <h3 style="margin-bottom: 16px; font-size: 14px; color: var(--text-main); font-weight: 800; letter-spacing: 0.5px;">📱 ÉTAPE 1 : EFFECTUER LE PAIEMENT</h3>
                            
                            <div style="display: flex; flex-direction: column; gap: 12px;">
                                <div style="display: flex; justify-content: space-between; align-items: center; background: rgba(255, 255, 255, 0.7); padding: 12px 16px; border-radius: 12px; border: 1px solid rgba(245, 158, 11, 0.15);">
                                    <span style="font-size: 12px; color: var(--text-muted); font-weight: 700;">👤 Bénéficiaire</span>
                                    <span style="font-size: 14px; font-weight: 800; color: var(--text-main);">${ev.beneficiaire_nom || 'Non renseigné'}</span>
                                </div>

                                <div style="display: flex; justify-content: space-between; align-items: center; background: rgba(255, 255, 255, 0.7); padding: 12px 16px; border-radius: 12px; border: 1px solid rgba(245, 158, 11, 0.15);">
                                    <span style="font-size: 12px; color: var(--text-muted); font-weight: 700;">📞 Contact</span>
                                    <span style="font-size: 14px; font-weight: 800; color: var(--text-main);">${infosCoordonnees}</span>
                                </div>
                            </div>

                            ${ev.rib_image_url || ev.qr_code_paiement ? `
                            <div style="margin-top: 14px; background: rgba(255, 255, 255, 0.8); padding: 16px; border-radius: 12px; border: 1px solid rgba(245, 158, 11, 0.15);">
                                <span style="font-size: 12px; color: var(--text-muted); font-weight: 700; display: block; margin-bottom: 12px; text-align: center;">💳 Scanner ou utiliser le RIB ci-dessous</span>
                                <div style="text-align: center;">
                                    <img src="${ev.rib_image_url || ev.qr_code_paiement}" alt="Support de paiement" style="max-width: 200px; width: 100%; height: auto; border-radius: 10px; display: inline-block; box-shadow: 0 8px 20px rgba(0,0,0,0.08); border: 1px solid #e2e8f0; background: #fff; padding: 6px; object-fit: contain;">
                                </div>
                            </div>
                            ` : ''}
                        </div>

                        <h3 class="form-section-title">📩 Étape 2 : Confirmez votre paiement</h3>
                        
                        ${selectionCategorieHTML}

                        <div class="form-group">
                            <label for="nomParticipant">Nom et Prénom :</label>
                            <input type="text" id="nomParticipant" placeholder="ex: KONATE Jean">
                        </div>

                        <div class="form-group">
                            <label for="emailParticipant">Adresse E-mail fonctionnelle (Réception du billet) :</label>
                            <input type="email" id="emailParticipant" placeholder="ex: nom@gmail.com" required>
                        </div>

                        <div class="form-group">
                            <label for="telParticipant">Numéro WhatsApp :</label>
                            <input type="tel" id="telParticipant" placeholder="ex: +226 ... / +212 ...">
                        </div>

                        <div class="form-group">
                            <label for="preuvePaiement">Preuve de paiement (Capture du reçu) :</label>
                            <input type="file" id="preuvePaiement" accept="image/*">
                        </div>

                        <button id="btnValiderAchat">Valider mon paiement & obtenir mon billet</button>
                    </div>
                `;
            }

            let affichagePrixHTML = "";
            if (ev.categories_data && Array.isArray(ev.categories_data) && ev.categories_data.length > 0) {
                affichagePrixHTML = ev.categories_data.map(c => `<div>🎫 <strong>${c.nom}</strong> : ${c.prix}</div>`).join("");
            } else {
                affichagePrixHTML = `💳 Prix du ticket : ${ev.prix || 'Gratuit'}`;
            }

            container.innerHTML = `
                <div class="grid-container">
                    
                    <div class="event-card">
                        <div class="event-poster-wrapper">
                            <img src="${ev.affiche_url || ''}" alt="Affiche" onerror="this.parentElement.innerHTML='<p style=\\'color:#64748b;padding:40px;\\'>🖼️ Affiche non disponible</p>'">
                        </div>
                        <h1 class="event-title">${ev.titre}</h1>
                        <div class="event-meta-item">📅 <span><strong>Date :</strong> ${ev.date}</span> <span style="margin-left: 15px;"><strong>Heure :</strong> ${ev.heure}</span></div>
                        <div class="event-meta-item">📍 <span><strong>Lieu :</strong> ${ev.lieu}</span></div>
                        <div>
                            <div class="price-badge" style="flex-direction: column; align-items: flex-start; gap: 4px; font-size: 15px;">
                                ${affichagePrixHTML}
                            </div>
                        </div>
                    </div>

                    <div>
                        ${contenuColonneDroite}
                    </div>

                </div>
            `;

            if (!ev.ventes_fermees) {
                document.getElementById("btnValiderAchat").onclick = async function() {
                    let nom = document.getElementById("nomParticipant").value.trim();
                    let email = document.getElementById("emailParticipant").value.trim();
                    let tel = document.getElementById("telParticipant").value.trim();
                    let fichierPreuve = document.getElementById("preuvePaiement").files[0];
                    
                    let typeBilletChoisi = "Standard";
                    const selectCat = document.getElementById("selectCategorie");
                    if (selectCat) {
                        typeBilletChoisi = selectCat.value; 
                    } else if (ev.prix) {
                        typeBilletChoisi = String(ev.prix);
                    }

                    if (!nom || !email || !tel || !fichierPreuve) {
                        alert("Veuillez remplir tous les champs et joindre la capture de paiement.");
                        return;
                    }

                    let btn = document.getElementById("btnValiderAchat");
                    btn.disabled = true;
                    btn.textContent = "⏳ Validation et envoi sécurisé en cours...";

                    try {
                        const { data: verifEv } = await window.supabaseClient
                            .from("evenements")
                            .select("ventes_fermees")
                            .eq("id", ev.id)
                            .single();

                        if (verifEv && verifEv.ventes_fermees) {
                            alert("Désolé, la vente des billets pour cet événement vient tout juste d'être fermée.");
                            window.location.reload();
                            return;
                        }

                        let fileExt = fichierPreuve.name.split('.').pop().toLowerCase();
                        let fileName = `preuve-${Date.now()}-${Math.floor(Math.random() * 1000)}.${fileExt}`;

                        const { error: uploadError } = await window.supabaseClient
                            .storage
                            .from("preuves")
                            .upload(fileName, fichierPreuve, { cacheControl: '3600', upsert: false });

                        if (uploadError) {
                            alert("Erreur lors de l'envoi de la preuve : " + uploadError.message);
                            btn.disabled = false;
                            btn.textContent = "Valider mon paiement & obtenir mon billet";
                            return;
                        }

                        const { data: urlData } = window.supabaseClient
                            .storage
                            .from("preuves")
                            .getPublicUrl(fileName);

                        let preuveUrl = urlData.publicUrl;

                        const { data: insertedBillet, error: insertError } = await window.supabaseClient
                            .from("billets")
                            .insert([
                                {
                                    evenement_id: ev.id,
                                    nom_participant: nom,
                                    email: email,
                                    telephone: tel,
                                    preuve_url: preuveUrl,
                                    type_billet: typeBilletChoisi, 
                                    statut: "attente",
                                    utilise: false
                                }
                            ])
                            .select();

                        if (insertError) {
                            alert("Erreur lors de l'enregistrement du billet : " + insertError.message);
                            btn.disabled = false;
                            btn.textContent = "Valider mon paiement & obtenir mon billet";
                            return;
                        }

                        if (insertedBillet && insertedBillet.length > 0) {
                            let idBilletCree = insertedBillet[0].id;
                            window.location.href = `billet.html?id=${idBilletCree}`;
                        }
                    } catch (err) {
                        console.error("Erreur inattendue :", err);
                        alert("Une erreur inattendue est survenue lors du traitement.");
                        btn.disabled = false;
                        btn.textContent = "Valider mon paiement & obtenir mon billet";
                    }
                };
            }
        }

        chargerPageAchatUnique();
    </script>
</body>
</html>
