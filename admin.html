<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Espace Organisateur - Gestion</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .tab-btn {
            flex: 1;
            padding: 12px;
            border: none;
            background-color: #e0e0e0;
            cursor: pointer;
            font-weight: bold;
            border-radius: 6px;
        }
        .tab-btn.active {
            background-color: #007bff;
            color: white;
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }
    </style>
</head>

<body>

    <div class="event-card" style="max-width: 600px; margin: 20px auto;">
        <h1>Espace Organisateur</h1>
        
        <!-- Onglets de navigation -->
        <div class="tabs">
            <button class="tab-btn active" onclick="changerOnglet('demandes')">💳 Paiements</button>
            <button class="tab-btn" onclick="changerOnglet('scanner')">📷 Scan Entrée</button>
        </div>

        <!-- Onglet 1 : Demandes de paiement -->
        <div id="sectionDemandes" class="tab-content active">
            <h2>Demandes de paiement</h2>
            <div id="listeDemandes"></div>
        </div>

        <!-- Onglet 2 : Scanner le jour J -->
        <div id="sectionScanner" class="tab-content">
            <h2>Contrôle des accès</h2>
            <div id="reader"></div>
            <div id="resultat" style="margin-top: 15px;"></div>
        </div>
    </div>

    <!-- Logique pour basculer entre les 2 onglets -->
    <script>
        function changerOnglet(nomOnglet) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

            if (nomOnglet === 'demandes') {
                document.querySelectorAll('.tab-btn')[0].classList.add('active');
                document.getElementById('sectionDemandes').classList.add('active');
            } else {
                document.querySelectorAll('.tab-btn')[1].classList.add('active');
                document.getElementById('sectionScanner').classList.add('active');
            }
        }
    </script>

    <!-- Chargement des scripts -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>
    <script src="script.js"></script>
    <script src="scanner.js"></script>

</body>

</html>
